# One command demo: docker compose up --build  ->  http://localhost:7860
services:
  app:
    build:
      context: .
      args:
        ENGINE: ${ENGINE:-lite}
    ports:
      - "7860:7860"
    env_file:
      - path: .env
        required: false
    volumes:
      - profiles:/app/data/profiles   # profiles added via /ingest survive restarts

volumes:
  profiles:
